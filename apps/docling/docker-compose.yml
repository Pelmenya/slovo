services:
  docling:
    build:
      context: .
      dockerfile: Dockerfile
    image: slovo/docling-service:0.1.0
    container_name: slovo-docling
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OMP_NUM_THREADS=4
      - TOKENIZERS_PARALLELISM=false
    restart: unless-stopped
    # Ограничения ресурсов — Docling прожорлив до RAM на больших PDF
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
