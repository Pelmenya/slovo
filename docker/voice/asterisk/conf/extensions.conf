[general]
static = yes
writeprotect = no

[globals]

; Входящие звонки в спайке не обрабатываем.
[from-trunk]
exten => _.,1,Hangup()

; Запасной путь: ARI originate передаёт канал в Stasis напрямую,
; но контекст полезен для ручной отладки из asterisk CLI.
[outbound]
exten => _X.,1,NoOp(Outbound to ${EXTEN})
    same => n,Stasis(slovo-voice)
    same => n,Hangup()
